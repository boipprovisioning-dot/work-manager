<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Management</title>
<style>
  :root{
    --navy-950:#0B1220;
    --navy-900:#101A2C;
    --navy-800:#1A2740;
    --navy-700:#25344F;
    --slate-400:#8A97AC;
    --slate-300:#B7C0CF;
    --paper:#F3F5F8;
    --paper-card:#FFFFFF;
    --line:#E4E8EF;
    --amber:#F2A93B;
    --amber-dim:#FCEBCB;
    --teal:#159E93;
    --teal-dim:#D7F0EC;
    --violet:#6E62C9;
    --violet-dim:#E4E1F7;
    --red:#DA5B5B;
    --red-dim:#FADADA;
    --green:#3F9E5D;
    --green-dim:#DCF0E2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--navy-950);
    font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif;
    font-size:14px;
  }
  .mono{ font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace; }
  #app{ display:flex; min-height:100vh; }

  /* Sidebar */
  #sidebar{
    width:220px; flex-shrink:0; background:var(--navy-950);
    color:var(--slate-300); display:flex; flex-direction:column;
    padding:18px 12px;
  }
  #sidebar .brand{
    display:flex; align-items:center; gap:8px; padding:6px 8px 18px 8px;
    color:#fff; font-weight:700; font-size:15px; letter-spacing:.2px;
    border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:14px;
  }
  #sidebar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(242,169,59,.25);}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    cursor:pointer; margin-bottom:2px; color:var(--slate-300); font-size:13.5px; font-weight:500;
    transition:background .12s, color .12s;
  }
  .nav-item svg{ width:16px; height:16px; flex-shrink:0; opacity:.85;}
  .nav-item:hover{ background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{ background:var(--amber); color:#231404; }
  .nav-item.active svg{ opacity:1; }
  #sidebar .footnote{ margin-top:auto; font-size:11px; color:var(--slate-400); padding:10px 8px; line-height:1.5;}

  /* Main */
  #main{ flex:1; min-width:0; padding:22px 28px 60px 28px; }
  .topbar{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .topbar h1{ font-size:20px; margin:0; font-weight:700; }
  .topbar .sub{ color:var(--slate-400); font-size:12.5px; margin-top:3px;}
  .btn{
    border:none; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:filter .1s, transform .05s;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-amber{ background:var(--amber); color:#241505; }
  .btn-amber:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:#fff; color:var(--navy-900); border:1px solid var(--line); }
  .btn-ghost:hover{ background:#f7f8fa; }
  .btn-danger{ background:var(--red-dim); color:#8a1f1f; }
  .btn-sm{ padding:5px 9px; font-size:12px; border-radius:6px; }

  .grid-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px;}
  .stat-card{ background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
  .stat-card .n{ font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .stat-card .l{ font-size:12px; color:var(--slate-400); margin-top:2px; }
  .stat-card.amber{ border-top:3px solid var(--amber); }
  .stat-card.teal{ border-top:3px solid var(--teal); }
  .stat-card.violet{ border-top:3px solid var(--violet); }
  .stat-card.red{ border-top:3px solid var(--red); }

  .card{ background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; }
  .card h3{ margin:0 0 12px 0; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:space-between; }
  .card h3 .hint{ font-weight:500; font-size:11.5px; color:var(--slate-400); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate-400); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line);}
  td{ padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tr:hover td{ background:#FAFBFD; }

  .badge{ display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:100px; font-size:11.5px; font-weight:700; font-family:'IBM Plex Mono',monospace;}
  .badge.morning{ background:var(--amber-dim); color:#8a5a0c; }
  .badge.afternoon{ background:var(--teal-dim); color:#0d5f57; }
  .badge.night{ background:var(--violet-dim); color:#453a9c; }
  .badge.off{ background:#EEF0F3; color:#7a8494; }
  .badge.pending{ background:var(--amber-dim); color:#8a5a0c; }
  .badge.confirmed{ background:var(--teal-dim); color:#0d5f57; }
  .badge.done{ background:var(--green-dim); color:#265c39; }
  .badge.cancelled{ background:var(--red-dim); color:#8a1f1f; }
  .badge.leavetype{ background:var(--red-dim); color:#8a1f1f; }
  select.badge-select{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700; border-radius:100px; padding:3px 9px; border:1px solid transparent; cursor:pointer; }
  select.badge-select.ref-pending{ background:var(--amber-dim); color:#8a5a0c; }
  select.badge-select.ref-completed{ background:var(--green-dim); color:#265c39; }
  select.badge-select.ref-cancel{ background:var(--red-dim); color:#8a1f1f; }

  input,select,textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px;
    font-size:13px; font-family:inherit; background:#fff; color:var(--navy-950);
  }
  input[type=checkbox],input[type=radio]{ width:auto; padding:0; border:none; background:none; flex:0 0 auto; }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--amber); outline-offset:0; border-color:var(--amber);}
  label{ font-size:12px; font-weight:600; color:var(--navy-800); display:block; margin-bottom:4px; }
  .field{ margin-bottom:12px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  dialog{ border:none; border-radius:12px; padding:0; width:min(480px,92vw); box-shadow:0 20px 60px rgba(10,20,40,.25); }
  dialog::backdrop{ background:rgba(10,17,32,.45); }
  .dialog-head{ padding:16px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .dialog-head h3{ margin:0; font-size:15px; }
  .dialog-body{ padding:18px; max-height:70vh; overflow-y:auto; overflow-x:hidden; }
  .dialog-foot{ padding:14px 18px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--slate-400); font-size:18px; line-height:1; padding:2px 6px; border-radius:6px; }
  .icon-btn:hover{ background:#f0f2f5; color:var(--navy-900);}

  .empty{ text-align:center; padding:34px 10px; color:var(--slate-400); font-size:13px; }
  .weeknav{ display:flex; align-items:center; gap:10px; }
  .weeknav .lbl{ font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; min-width:150px; text-align:center;}

  .cell-shift{ cursor:pointer; border:1px dashed transparent; border-radius:7px; padding:4px; min-height:30px; display:flex; align-items:center; justify-content:center;}
  .cell-shift:hover{ border-color:var(--slate-300); background:#FAFBFD; }
  .day-col-head{ text-align:center !important; }
  .today-col{ background:#FFF9EE; }

  .leave-grid{ display:grid; grid-template-columns: 140px 1fr; }
  .leave-row{ display:contents; }
  .leave-name{ padding:8px 10px; font-weight:600; border-bottom:1px solid var(--line); display:flex; align-items:center; font-size:12.5px;}
  .leave-days{ display:grid; grid-template-columns:repeat(var(--ndays,30),1fr); border-bottom:1px solid var(--line); position:relative; }
  .leave-day{ border-left:1px solid #F0F2F5; min-height:34px; }
  .leave-day.weekend{ background:#FAFBFD; }
  .leave-bar{ position:absolute; height:20px; top:7px; border-radius:5px; font-size:10px; color:#fff; display:flex; align-items:center; padding:0 6px; overflow:hidden; white-space:nowrap; font-weight:600;}
  .leave-header-days{ display:grid; grid-template-columns:repeat(var(--ndays,30),1fr); }
  .leave-header-day{ text-align:center; font-size:10px; color:var(--slate-400); padding-bottom:4px; font-family:'IBM Plex Mono',monospace;}

  .pill-tabs{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .pill-tab{ padding:6px 12px; border-radius:100px; background:#fff; border:1px solid var(--line); font-size:12.5px; font-weight:600; cursor:pointer; color:var(--slate-400); }
  .pill-tab.active{ background:var(--navy-950); color:#fff; border-color:var(--navy-950); }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end; }
  .filters .field{ margin-bottom:0; min-width:150px; }

  .banner{ background:var(--violet-dim); color:#3c3178; padding:10px 14px; border-radius:8px; font-size:12.5px; margin-bottom:16px; display:flex; gap:8px; align-items:center;}
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:#D8DDE6; border-radius:8px; }

  /* Calendar */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); }
  .cal-head{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:0; }
  .cal-head div{ text-align:center; font-size:11.5px; font-weight:700; color:var(--slate-400); padding:6px 0; text-transform:uppercase; letter-spacing:.03em; }
  .cal-cell{ border-right:1px solid var(--line); border-bottom:1px solid var(--line); min-height:104px; padding:6px; cursor:pointer; display:flex; flex-direction:column; gap:3px; background:#fff; }
  .cal-cell:hover{ background:#FAFBFD; }
  .cal-cell.outside{ background:#FBFBFC; color:#C6CCD6; }
  .cal-cell.today{ background:#FFF9EE; }
  .cal-daynum{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  .cal-daynum .weekend-tag{ font-size:9px; color:var(--slate-400); font-weight:500; }
  .cal-tag{ font-size:10px; padding:1px 6px; border-radius:5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cal-tag.shift{ background:var(--amber-dim); color:#8a5a0c; }
  .cal-tag.leave{ background:var(--red-dim); color:#8a1f1f; }
  .cal-more{ font-size:10px; color:var(--slate-400); font-weight:600; }
  .legend-dot{ width:9px;height:9px;border-radius:3px;display:inline-block; }

  @media (max-width:820px){
    #sidebar{ display:none; }
    #main{ padding:16px; }
    .field-row{ grid-template-columns:1fr; }
  }

  /* Auth screen */
  .auth-wrap{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; background:var(--navy-950); padding:20px; }
  .auth-card{ width:100%; max-width:380px; background:#fff; border-radius:14px; padding:28px 26px; box-shadow:0 24px 70px rgba(0,0,0,.35); }
  .auth-card .brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; margin-bottom:6px; color:var(--navy-950); }
  .auth-card .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(242,169,59,.25);}
  .auth-card .sub{ color:var(--slate-400); font-size:12.5px; margin-bottom:20px; }
  .auth-card .btn{ width:100%; justify-content:center; margin-top:6px; }
  .auth-error{ background:var(--red-dim); color:#8a1f1f; font-size:12.5px; padding:8px 10px; border-radius:7px; margin-bottom:12px; }
  .auth-switch{ text-align:center; font-size:12.5px; color:var(--slate-400); margin-top:16px; }
  .auth-switch a{ color:var(--amber); font-weight:600; cursor:pointer; text-decoration:none; }
  .role-badge{ display:inline-block; padding:2px 8px; border-radius:100px; font-size:10.5px; font-weight:700; }
  .role-badge.admin{ background:var(--violet-dim); color:#453a9c; }
  .role-badge.staff{ background:var(--teal-dim); color:#0d5f57; }
</style>
</head>
<body>
<div id="authScreen" class="auth-wrap" style="display:none;"></div>
<div id="app" style="display:none;">
  <div id="sidebar">
    <div class="brand"><span class="dot"></span> Job Management</div>
    <div id="nav"></div>
    <div id="userBox" style="border-top:1px solid rgba(255,255,255,.08); margin-top:10px; padding-top:12px;"></div>
    <div class="footnote">ข้อมูลทั้งหมดในระบบนี้ใช้ร่วมกันกับทุกคนที่เปิดหน้านี้<br><span style="opacity:.6;">Build: 2026-08-31-schedimport-v3-tzfix</span></div>
  </div>
  <div id="main">
    <div class="banner" id="storageBanner">🔔 ข้อมูลในเว็บนี้เป็นข้อมูลส่วนกลาง (shared) — ทุกคนที่เปิดหน้านี้จะเห็นและแก้ไขข้อมูลเดียวกันได้</div>
    <div id="content"></div>
  </div>
</div>

<dialog id="dlg"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------------- storage helpers (Supabase) ---------------- */
// 1) ไปที่ https://supabase.com สร้างโปรเจกต์ฟรี
// 2) ไปที่ Project Settings > API แล้วคัดลอกค่า 2 อย่างมาแปะแทนที่ด้านล่างนี้
const SUPABASE_URL = 'https://vjqcrriosqddhjtkejyl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_L-oLa77Na9s_5iMMB8Cg7g_lfIIKy8Z';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadList(key){
  try{
    const { data, error } = await supabaseClient
      .from('app_data')
      .select('value')
      .eq('key', key)
      .maybeSingle();
    if(error || !data) return [];
    return data.value || [];
  }catch(e){ console.error('load fail', key, e); return []; }
}
async function saveList(key, arr){
  try{
    const { error } = await supabaseClient
      .from('app_data')
      .upsert({ key, value: arr, updated_at: new Date().toISOString() });
    if(error) console.error('save fail', key, error);
  }catch(e){ console.error('save fail', key, e); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------------- realtime sync (Supabase Realtime) ---------------- */
// ทำให้ทุกคนที่เปิดหน้านี้เห็นข้อมูลใหม่ทันทีที่มีคนอื่นบันทึกข้อมูล โดยไม่ต้อง refresh หน้าเว็บเอง
// หมายเหตุ: ต้องเปิดใช้งาน Realtime ให้ตาราง app_data ในฝั่ง Supabase ก่อน (ดูคำแนะนำท้ายไฟล์นี้)
function keyToStateField(key){
  return {
    'employees':'employees',
    'shifts':'shifts',
    'appointments':'appointments',
    'ot-entries':'otEntries',
    'leaves':'leaves',
    'planworks':'planworks',
    'users':'users',
  }[key];
}
function subscribeRealtime(){
  try{
    supabaseClient
      .channel('app_data_changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_data' }, (payload)=>{
        const key = (payload.new && payload.new.key) || (payload.old && payload.old.key);
        const field = keyToStateField(key);
        if(!field) return;
        state[field] = (payload.eventType === 'DELETE') ? [] : ((payload.new && payload.new.value) || []);
        // อัปเดตเฉพาะเนื้อหาบนหน้าจอ ไม่ไปยุ่งกับฟอร์ม/ไดอะล็อกที่กำลังเปิดอยู่ (dialog อยู่นอก #content)
        if(session.user && document.getElementById('app').style.display !== 'none'){
          renderNav();
          renderContent();
        }
      })
      .subscribe();
  }catch(e){ console.error('realtime subscribe fail', e); }
}

/* ---------------- state ---------------- */
let session = { user: null };
let state = {
  employees: [],
  shifts: [],       // {id, date:'YYYY-MM-DD', employeeId, type}
  appointments: [],  // {id, date, time, customer, phone, address, employeeId, status, note, submittedBy}
  otEntries: [],     // {id, employeeId, date, hours, reason}
  leaves: [],        // {id, employeeId, type, start, end, note, status}
  planworks: [],     // {id, date, dnType, dnTime, planNo, detail, node, reference, assignBy, workType, vendor, remark, remarkMail, completed, cancelled}
  users: [],         // {id, username, passwordHash, name, role: 'admin'|'staff'}
  route: 'overview',
  weekStart: startOfWeek(new Date()),
  leaveMonth: new Date().getMonth(),
  leaveYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  otMonth: new Date().getMonth(),
  otYear: new Date().getFullYear(),
  apptFilter: 'all',
  planworkSearch: '',
  planworkDateFrom: '',
  planworkDateTo: '',
  planworkPage: 1,
  planworkPageSize: 10,
  planworkSelected: new Set(),
  apptSelected: new Set(),
  reportPeriod: 'month',
  reportRef: fmtDate(new Date()),
};

function dmy(iso){
  if(!iso) return '-';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function startOfWeek(d){
  const nd = new Date(d);
  const day = (nd.getDay()+6)%7; // Monday=0
  nd.setDate(nd.getDate()-day);
  nd.setHours(0,0,0,0);
  return nd;
}
function fmtDate(d){
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function thaiDate(iso){
  const d = new Date(iso+'T00:00:00');
  const days=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}
function empName(id){ const e = state.employees.find(x=>x.id===id); return e? e.name : '(ไม่ระบุ)'; }
function getOnDutyNamesForDate(dateIso, roleFilter){
  const shifts = state.shifts.filter(s=>s.date===dateIso);
  if(roleFilter){
    // shift.note carries the role tag set during schedule import (e.g. "MPLS", "TI", "VOICE and DID")
    const matched = shifts.filter(s=> (s.note||'').toUpperCase().includes(roleFilter.toUpperCase()));
    if(matched.length) return matched.map(s=>empName(s.employeeId)).filter(Boolean);
    // fall back to everyone on duty that day if nobody has the role tagged (e.g. manually-added shifts)
  }
  return shifts.map(s=>empName(s.employeeId)).filter(Boolean);
}
// NOTE: intentionally not using SheetJS's cellDates Date objects for imports — its date
// conversion has been found to shift by a day depending on the browser's local timezone
// (e.g. under Asia/Bangkok). All Excel date cells are instead read as raw serial numbers
// and converted with excelSerialToISO (pure integer math, timezone-independent).
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }

// approval workflow status — independent from whether the job itself is finished
const APPROVAL_STATUS = [
  {v:'pending', label:'รอดำเนินการ', cls:'pending'},
  {v:'approved', label:'อนุมัติแล้ว', cls:'confirmed'},
  {v:'cancelled', label:'ยกเลิก', cls:'cancelled'},
];
// completion (work-done) status — tracked separately from approval
const DONE_STATUS = [
  {v:'not_done', label:'ยังไม่เสร็จ', cls:'pending'},
  {v:'done', label:'เสร็จสิ้น', cls:'done'},
];
// reads approvalStatus/doneStatus when present; falls back to the old combined
// `status` field so appointments saved before this split still display correctly
function apptApprovalStatus(a){
  if(a.approvalStatus) return a.approvalStatus;
  if(a.status==='cancelled') return 'cancelled';
  if(a.status==='pending' || !a.status) return 'pending';
  return 'approved'; // legacy 'confirmed' or 'done' both implied an approved appointment
}
function apptDoneStatus(a){
  if(a.doneStatus) return a.doneStatus;
  return a.status==='done' ? 'done' : 'not_done';
}

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function bindAuthEvents(mode){
  if(mode==='register'){
    document.getElementById('goLogin').onclick = ()=> showAuthScreen('login');
    document.getElementById('rg_submit').onclick = async ()=>{
      const name = document.getElementById('rg_name').value.trim();
      const username = document.getElementById('rg_username').value.trim().toLowerCase();
      const email = document.getElementById('rg_email').value.trim();
      const role = document.getElementById('rg_role').value === 'admin' ? 'admin' : 'staff';
      const pass = document.getElementById('rg_pass').value;
      const pass2 = document.getElementById('rg_pass2').value;
      if(!name || !username || !email || !pass){ showAuthScreen('register','กรุณากรอกข้อมูลให้ครบ'); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showAuthScreen('register','กรุณากรอก Email ให้ถูกต้อง'); return; }
      if(pass.length<6){ showAuthScreen('register','รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); return; }
      if(pass!==pass2){ showAuthScreen('register','รหัสผ่านทั้งสองช่องไม่ตรงกัน'); return; }
      if(state.users.some(u=>u.username.toLowerCase()===username)){ showAuthScreen('register','มีชื่อผู้ใช้นี้อยู่แล้ว กรุณาตั้งชื่ออื่น'); return; }
      const passwordHash = await sha256(pass);
      const user = {id:uid(), username, name, email, passwordHash, role, approved:false};
      state.users.push(user);
      await saveList('users', state.users);
      showAuthScreen('login', 'ลงทะเบียนสำเร็จ! กรุณารอผู้ดูแลระบบอนุมัติบัญชีก่อนเข้าสู่ระบบ', 'success');
    };
  } else {
    document.getElementById('goRegister').onclick = ()=> showAuthScreen('register');
    document.getElementById('li_submit').onclick = async ()=>{
      const username = document.getElementById('li_username').value.trim().toLowerCase();
      const pass = document.getElementById('li_pass').value;
      if(!username || !pass){ showAuthScreen('login','กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }
      const passwordHash = await sha256(pass);
      const user = state.users.find(u=> u.username.toLowerCase()===username && u.passwordHash===passwordHash);
      if(!user){ showAuthScreen('login','ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); return; }
      if(user.approved===false){ showAuthScreen('login','บัญชีนี้ยังไม่ได้รับการอนุมัติจากผู้ดูแลระบบ กรุณาติดต่อผู้ดูแลระบบ'); return; }
      session.user = user;
      try{ localStorage.setItem('my-session', JSON.stringify({userId:user.id})); }catch(e){}
      enterApp();
    };
    // allow Enter key to submit
    const passField = document.getElementById('li_pass');
    if(passField) passField.addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('li_submit').click(); });
  }
}

/* ================= CALENDAR ================= */
function dayInfo(iso){
  const onDuty = state.shifts.filter(s=>s.date===iso);
  const onLeave = state.leaves.filter(l=> l.start<=iso && l.end>=iso);
  return {onDuty, onLeave};
}

function viewCalendar(){
  const y = state.calYear, m = state.calMonth;
  const monthNames=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const dowLabels=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const first = new Date(y,m,1);
  const firstDow = first.getDay(); // Sunday=0
  const nd = daysInMonth(y,m);
  const todayIso = fmtDate(new Date());

  const cells = [];
  // leading blanks from previous month
  const prevMonthDays = daysInMonth(m===0?y-1:y, m===0?11:m-1);
  for(let i=firstDow-1;i>=0;i--){
    cells.push({dayNum: prevMonthDays-i, outside:true, iso:null});
  }
  for(let d=1; d<=nd; d++){
    cells.push({dayNum:d, outside:false, iso:`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`});
  }
  while(cells.length % 7 !== 0){
    cells.push({dayNum: cells.length, outside:true, iso:null});
  }

  const cellsHtml = cells.map(c=>{
    if(c.outside) return `<div class="cal-cell outside"><div class="cal-daynum">${c.dayNum}</div></div>`;
    const {onDuty, onLeave} = dayInfo(c.iso);
    const isToday = c.iso===todayIso;
    const dow = new Date(c.iso+'T00:00:00').getDay();
    const isWeekend = dow===0||dow===6;
    const tags = [];
    onDuty.slice(0,2).forEach(s=> tags.push(`<div class="cal-tag shift">🛠 ${empName(s.employeeId)} (Standby)</div>`));
    onLeave.slice(0,2).forEach(l=> tags.push(`<div class="cal-tag leave" style="background:${LEAVE_COLORS[l.type]}22;color:${LEAVE_COLORS[l.type]};">🌴 ${empName(l.employeeId)} (${l.type} ${dmy(l.start)}-${dmy(l.end)}${l.timeStart? ` ${l.timeStart}-${l.timeEnd}`:''})</div>`));
    const shown = onDuty.slice(0,2).length + onLeave.slice(0,2).length;
    const total = onDuty.length + onLeave.length;
    const more = total>shown ? `<div class="cal-more">+${total-shown} เพิ่มเติม</div>` : '';
    return `<div class="cal-cell ${isToday?'today':''}" data-day="${c.iso}">
      <div class="cal-daynum">${c.dayNum} ${isWeekend?'<span class="weekend-tag">หยุด</span>':''}</div>
      ${tags.join('')}${more}
    </div>`;
  }).join('');

  return `
    <div class="topbar">
      <div><h1>ปฏิทิน</h1><div class="sub">ภาพรวมคนอยู่เวรและคนลาในแต่ละวัน คลิกวันที่เพื่อดูรายละเอียด</div></div>

      </div>
    </div>
    <div class="card" style="padding:14px; overflow-x:auto;">
      <div style="min-width:640px;">

    <div style="display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--slate-400); margin-top:6px;">

      <div style="display:flex;align-items:center;gap:6px;"><span class="legend-dot" style="background:var(--red);"></span>🌴 มีคนลา</div>

/* ================= REPORT ================= */
const REPORT_PERIODS = [
  {v:'day', label:'วัน'},
  {v:'week', label:'สัปดาห์'},
  {v:'month', label:'เดือน'},
  {v:'year', label:'ปี'},
];
const MONTH_NAMES_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

function overlapDays(aStart, aEnd, bStart, bEnd){
  const s = aStart > bStart ? aStart : bStart;
  const e = aEnd < bEnd ? aEnd : bEnd;
  if(s > e) return 0;
  const d1 = new Date(s+'T00:00:00'), d2 = new Date(e+'T00:00:00');
  return Math.round((d2-d1)/86400000) + 1;
}

function getReportRange(){
  const period = state.reportPeriod;
  const ref = new Date(state.reportRef+'T00:00:00');
  const p = n=>String(n).padStart(2,'0');
  if(period==='day'){
    const iso = fmtDate(ref);
    return {start:iso, end:iso, label: thaiDate(iso)};
  }
  if(period==='week'){
    const start = startOfWeek(ref);
    const end = new Date(start); end.setDate(end.getDate()+6);
    return {start:fmtDate(start), end:fmtDate(end), label:`${thaiDate(fmtDate(start))} – ${thaiDate(fmtDate(end))}`};
  }
  if(period==='year'){
    const y = ref.getFullYear();
    return {start:`${y}-01-01`, end:`${y}-12-31`, label:`ปี ${y+543}`};
  }
  // month (default)
  const y = ref.getFullYear(), m = ref.getMonth();
  return {
    start: `${y}-${p(m+1)}-01`,
    end: `${y}-${p(m+1)}-${p(daysInMonth(y,m))}`,
    label: `${MONTH_NAMES_TH[m]} ${y+543}`
  };
}

function shiftReportRef(delta){
  const ref = new Date(state.reportRef+'T00:00:00');
  const period = state.reportPeriod;
  if(period==='day') ref.setDate(ref.getDate()+delta);
  else if(period==='week') ref.setDate(ref.getDate()+delta*7);
  else if(period==='year') ref.setFullYear(ref.getFullYear()+delta);
  else ref.setMonth(ref.getMonth()+delta);
  state.reportRef = fmtDate(ref);
}

function computeReportData(){
  const {start, end, label} = getReportRange();

  const shiftsInRange = state.shifts.filter(s=> s.date>=start && s.date<=end);
  const shiftTotals = {};
  shiftsInRange.forEach(s=>{
    shiftTotals[s.employeeId] = (shiftTotals[s.employeeId]||0) + 1;
  });

  const apptsInRange = state.appointments.filter(a=> a.date>=start && a.date<=end);
  const apptCounts = {};
  APPROVAL_STATUS.forEach(s=> apptCounts[s.v] = apptsInRange.filter(a=>apptApprovalStatus(a)===s.v).length);
  const apptDoneCount = apptsInRange.filter(a=> apptDoneStatus(a)==='done').length;

  const pwInRange = state.planworks.filter(p=> p.date>=start && p.date<=end);
  const pwByType = {}; // {workType: {total, completed, cancelled}}
  pwInRange.forEach(p=>{
    const k = p.workType || 'ไม่ระบุ';
    if(!pwByType[k]) pwByType[k] = {total:0, completed:0, cancelled:0};
    pwByType[k].total++;
    const st = pwStatusOf(p);
    if(st==='completed') pwByType[k].completed++;
    else if(st==='cancelled') pwByType[k].cancelled++;
  });
  const pwCompletedCount = pwInRange.filter(p=>pwStatusOf(p)==='completed').length;
  const pwCancelledCount = pwInRange.filter(p=>pwStatusOf(p)==='cancelled').length;

  const otInRange = state.otEntries.filter(o=> o.date>=start && o.date<=end);
  const otTotals = {};
  const otWeightedTotals = {};
  otInRange.forEach(o=>{
    const mult = Number(o.multiplier||1);
    otTotals[o.employeeId] = (otTotals[o.employeeId]||0) + Number(o.hours||0);
    otWeightedTotals[o.employeeId] = (otWeightedTotals[o.employeeId]||0) + Number(o.hours||0)*mult;
  });
  const otSumAll = otInRange.reduce((s,o)=> s + Number(o.hours||0), 0);
  const otWeightedSumAll = otInRange.reduce((s,o)=> s + Number(o.hours||0)*Number(o.multiplier||1), 0);

  const leavesInRange = state.leaves.filter(l=> l.start<=end && l.end>=start);
  const leaveDaysByEmp = {};
  const leaveDaysByType = {};
  let totalLeaveDays = 0;
  leavesInRange.forEach(l=>{
    const days = overlapDays(l.start, l.end, start, end);
    leaveDaysByEmp[l.employeeId] = (leaveDaysByEmp[l.employeeId]||0) + days;
    leaveDaysByType[l.type] = (leaveDaysByType[l.type]||0) + days;
    totalLeaveDays += days;
  });

  return {
    start, end, label,
    shiftsInRange, shiftTotals,
    apptsInRange, apptCounts, apptDoneCount,
    pwInRange, pwByType, pwCompletedCount, pwCancelledCount,
    otInRange, otTotals, otSumAll, otWeightedTotals, otWeightedSumAll,
    leavesInRange, leaveDaysByEmp, leaveDaysByType, totalLeaveDays,
  };
}

  try{
    const d = computeReportData();
    const wb = XLSX.utils.book_new();

    const summaryRows = [
      ['รายงานภาพรวม', d.label],
      ['ช่วงวันที่', `${d.start} ถึง ${d.end}`],
      [],
      ['หัวข้อ','จำนวน'],
      ['เวรที่จัดทั้งหมด', d.shiftsInRange.length],
      ['นัดหมายติดตั้ง', d.apptsInRange.length],
      ['Planwork', d.pwInRange.length],
      ['Planwork Completed', d.pwCompletedCount],
      ['Planwork Cancelled', d.pwCancelledCount],
      ['ชั่วโมง OT รวม', Number(d.otSumAll.toFixed(1))],
      ['วันลารวม (วัน)', d.totalLeaveDays],
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), 'สรุป');

    const shiftRows = [['พนักงาน','จำนวนวันอยู่เวร']];
    state.employees.forEach(e=>{
      shiftRows.push([e.name, d.shiftTotals[e.id] || 0]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(shiftRows), 'ตารางเวร');

    const apptRows = [['สถานะ','จำนวน']];
    APPROVAL_STATUS.forEach(s=> apptRows.push([s.label, d.apptCounts[s.v]]));
    apptRows.push(['เสร็จสิ้นแล้ว (งาน)', d.apptDoneCount]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(apptRows), 'นัดหมายติดตั้ง');

    const pwRows = [['Work Type','จำนวน','Completed','Cancelled']];
    Object.entries(d.pwByType).forEach(([k,v])=> pwRows.push([k, v.total, v.completed||0, v.cancelled||0]));
    pwRows.push(['รวม', d.pwInRange.length, d.pwCompletedCount, d.pwCancelledCount]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pwRows), 'Planwork');

    const otRows = [['พนักงาน','ชั่วโมง OT','ชั่วโมงเทียบเท่า (คูณแรง)']];
    state.employees.forEach(e=> otRows.push([e.name, Number((d.otTotals[e.id]||0).toFixed(1)), Number((d.otWeightedTotals[e.id]||0).toFixed(1))]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(otRows), 'OT');

    const leaveRows = [['พนักงาน','วันลา (วัน)']];
    state.employees.forEach(e=> leaveRows.push([e.name, d.leaveDaysByEmp[e.id]||0]));
    leaveRows.push([]);
    leaveRows.push(['ประเภทการลา','วันลา (วัน)']);
    LEAVE_TYPES.filter(t=>d.leaveDaysByType[t]).forEach(t=> leaveRows.push([t, d.leaveDaysByType[t]]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(leaveRows), 'การลา');

    XLSX.writeFile(wb, `รายงาน_${d.start}_ถึง_${d.end}.xlsx`);
    if(statusEl) statusEl.innerHTML = `<div class="banner" style="background:var(--green-dim); color:#265c39;">✅ สร้างไฟล์ Excel สำเร็จ</div>`;
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.innerHTML = `<div class="banner" style="background:var(--red-dim); color:#8a1f1f;">⚠ สร้างไฟล์ Excel ไม่สำเร็จ: ${err.message||err}</div>`;
  }
}

      data:{ labels: APPROVAL_STATUS.map(s=>s.label), datasets:[{ data: APPROVAL_STATUS.map(s=>d.apptCounts[s.v]), backgroundColor:['#F2A93B','#159E93','#DA5B5B'] }] },
    }, 700, 500);
    slides.push({type:'image', title:'นัดหมายติดตั้งตามสถานะอนุมัติ', dataUrl:apptChart, wIn:6.5, hIn:4.6});

    if(Object.keys(d.pwByType).length){
      const pwChart = await renderChartPng({
        type:'bar',
        data:{ labels:Object.keys(d.pwByType), datasets:[{ label:'จำนวน', data:Object.values(d.pwByType), backgroundColor:'#6E62C9' }] },
        options:{ indexAxis:'y', plugins:{legend:{display:false}} }
      }, 900, 500);
      slides.push({type:'image', title:'Planwork แยกตาม Work Type', dataUrl:pwChart, wIn:9, hIn:5});
    }

    if(empNames.length){
      const otChart = await renderChartPng({
        type:'bar',
        data:{ labels: empNames, datasets:[{ label:'ชั่วโมง OT', data: state.employees.map(e=>Number((d.otTotals[e.id]||0).toFixed(1))), backgroundColor:'#F2A93B' }] },
        options:{ plugins:{legend:{display:false}} }
      }, 900, 500);
      slides.push({type:'image', title:'ชั่วโมง OT ตามพนักงาน', dataUrl:otChart, wIn:9, hIn:5});
    }

    const leaveTypesWithData = LEAVE_TYPES.filter(t=>d.leaveDaysByType[t]);
    if(leaveTypesWithData.length){
      const leaveChart = await renderChartPng({
        type:'doughnut',
        data:{ labels:leaveTypesWithData, datasets:[{ data:leaveTypesWithData.map(t=>d.leaveDaysByType[t]), backgroundColor:leaveTypesWithData.map(t=>LEAVE_COLORS[t]) }] },
      }, 700, 500);
      slides.push({type:'image', title:'วันลาแยกตามประเภท (วัน)', dataUrl:leaveChart, wIn:6.5, hIn:4.6});
    }

    if(empNames.length){
      slides.push({type:'table', title:'วันลาแยกตามพนักงาน', headers:['พนักงาน','วันลา (วัน)'], rows: state.employees.map(e=>[e.name, String(d.leaveDaysByEmp[e.id]||0)])});
    }

    const blob = await buildPptxBlob(slides);
    downloadBlob(blob, `รายงาน_${d.start}_ถึง_${d.end}.pptx`);
    if(statusEl) statusEl.innerHTML = `<div class="banner" style="background:var(--green-dim); color:#265c39;">✅ สร้างไฟล์ PowerPoint สำเร็จ (${slides.length} สไลด์)</div>`;
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.innerHTML = `<div class="banner" style="background:var(--red-dim); color:#8a1f1f;">⚠ สร้างไฟล์ PowerPoint ไม่สำเร็จ: ${err.message||err}</div>`;
  }
}

function pptxSlideRelsXml(hasImage){
  let rels = '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout7.xml"/>';
  if(hasImage) rels += '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/{IMG}"/>';
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`;
}

function dataUrlToUint8(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function renderChartPng(config, wPx, hPx){
  return new Promise((resolve)=>{
    const canvas = document.createElement('canvas');
    canvas.width = wPx; canvas.height = hPx;
    canvas.style.position='fixed'; canvas.style.left='-99999px'; canvas.style.top='0';
    document.body.appendChild(canvas);
    config.options = config.options || {};
    config.options.animation = false;
    config.options.responsive = false;
    const chart = new Chart(canvas.getContext('2d'), config);
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const url = canvas.toDataURL('image/png');
        chart.destroy();
        document.body.removeChild(canvas);
        resolve(url);
      });
    });
  });
}

async function buildPptxBlob(slideSpecs){
  const zip = await JSZip.loadAsync(PPTX_SKELETON_B64, {base64:true});
  const sldIdEntries = [];
  const presRelsEntries = [];
  const ctEntries = [];
  let mediaCounter = 1;
  const ridStart = 100, sidStart = 300;

  for(let i=0;i<slideSpecs.length;i++){
    const spec = slideSpecs[i];
    const n = i+1;
    let xml, relsXml;
    if(spec.type==='text'){
      xml = pptxTextSlideXml(spec.lines);
      relsXml = pptxSlideRelsXml(false);
    } else if(spec.type==='table'){
      xml = pptxTableSlideXml(spec.title, spec.headers, spec.rows);
      relsXml = pptxSlideRelsXml(false);
    } else if(spec.type==='image'){
      xml = pptxImageSlideXml(spec.title, spec.wIn||8, spec.hIn||4.5);
      const imgName = `chart${mediaCounter++}.png`;
      zip.file(`ppt/media/${imgName}`, dataUrlToUint8(spec.dataUrl));
      relsXml = pptxSlideRelsXml(true).replace('{IMG}', imgName);
    }
    zip.file(`ppt/slides/slide${n}.xml`, xml);
    zip.file(`ppt/slides/_rels/slide${n}.xml.rels`, relsXml);
    const rid = ridStart+n, sid = sidStart+n;
    sldIdEntries.push(`<p:sldId id="${sid}" r:id="rId${rid}"/>`);
    presRelsEntries.push(`<Relationship Id="rId${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${n}.xml"/>`);
    ctEntries.push(`<Override PartName="/ppt/slides/slide${n}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`);
  }

  let presXml = await zip.file('ppt/presentation.xml').async('string');
  presXml = presXml.replace('<p:sldIdLst/>', `<p:sldIdLst>${sldIdEntries.join('')}</p:sldIdLst>`);
  zip.file('ppt/presentation.xml', presXml);

  let presRels = await zip.file('ppt/_rels/presentation.xml.rels').async('string');
  presRels = presRels.replace('</Relationships>', presRelsEntries.join('')+'</Relationships>');
  zip.file('ppt/_rels/presentation.xml.rels', presRels);

  let ct = await zip.file('[Content_Types].xml').async('string');
  ct = ct.replace('</Types>', ctEntries.join('')+'</Types>');
  zip.file('[Content_Types].xml', ct);

  return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

/* ---------------- Excel import for Schedule (calendar-grid roster format) ---------------- */
// Layout: each week block is 4 rows in the same columns — a date-header row,
// then 3 duty rows underneath it at fixed offsets: +1 MPLS, +2 TI, +3 VOICE and DID.
const SCHEDULE_ROLE_BY_OFFSET = {1:'MPLS', 2:'TI', 3:'VOICE and DID'};
const SCHEDULE_ROLE_KEYWORDS = ['VOICE and DID', 'MPLS', 'TI'];

function parseDutyCellText(text, roleHint){
  if(text==null) return [];
  text = String(text).trim();
  if(!text) return [];
  if(/^update/i.test(text) || text==='>>' || /^s$/i.test(text) || /^new start/i.test(text)) return [];

  // Case A: "Name(sublabel)" chunks with no space (e.g. "Weeraphong(day time) Mongkol(night time)")
  const parenPattern = /([A-Za-zก-๙]+)\(([^)]+)\)/g;
  let m, direct = [];
  while((m = parenPattern.exec(text)) !== null){
    const candidate = m[1].trim();
    if(!SCHEDULE_ROLE_KEYWORDS.some(k=>k.toLowerCase()===candidate.toLowerCase())){
      direct.push({ name: candidate, sub: m[2].trim(), role: roleHint });
    }
  }
  if(direct.length) return direct;

  // Case B: "Name ROLE", "Name ROLE (Sub)", "NameA & NameB ROLE"
  let sub = '';
  const subMatch = text.match(/\(([^)]+)\)\s*$/);
  if(subMatch){ sub = subMatch[1].trim(); text = text.slice(0, subMatch.index).trim(); }

  let role = roleHint;
  for(const k of SCHEDULE_ROLE_KEYWORDS){
    const idx = text.toLowerCase().lastIndexOf(k.toLowerCase());
    if(idx !== -1){
      role = k;
      text = (text.slice(0, idx) + ' ' + text.slice(idx+k.length)).trim();
      break;
    }
  }
  return text.split('&').map(n=>n.trim()).filter(Boolean).map(n=>({name:n, sub, role}));
}

async function handleScheduleExcelImport(file, clearFirst){
  const statusEl = document.getElementById('scheduleImportStatus');
  if(statusEl) statusEl.innerHTML = `<div class="banner">⏳ กำลังอ่านไฟล์ ${file.name} ...</div>`;
  try{
    if(clearFirst){
      state.shifts = [];
      await saveList('shifts', state.shifts);
    }
    const buf = await file.arrayBuffer();
    // NOTE: cellDates:true is intentionally NOT used here — SheetJS's date-cell-to-Date
    // conversion has been found to be sensitive to the runtime's local timezone (e.g. it
    // shifts by a day under Asia/Bangkok), so we read raw Excel serial numbers instead and
    // convert them ourselves with pure integer math (see excelSerialToISO), which is fully
    // timezone-independent and gives correct results regardless of the browser's clock.
    const wb = XLSX.read(buf, {type:'array', cellDates:false});

    // map/create employees by name as we go
    const nameToEmpId = {};
    state.employees.forEach(e=> nameToEmpId[e.name.trim().toLowerCase()] = e.id);
    const existingKeys = new Set(state.shifts.map(s=>`${s.employeeId}|${s.date}`));
    const newShiftsByKey = {}; // key -> {employeeId, date, notes:Set}

    let sheetsRead = 0, entriesFound = 0;
    for(const sheetName of wb.SheetNames){
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:null});
      sheetsRead++;
      for(let r=0; r<rows.length; r++){
        const row = rows[r] || [];
        for(let c=0; c<row.length; c++){
          const val = row[c];
          // date-header cells are Excel serial numbers in a sane date range (~2005-2075)
          if(typeof val !== 'number' || val < 38000 || val > 65000) continue;
          const dateIso = excelSerialToISO(val);
          for(let offset=1; offset<=3; offset++){
            const dutyRow = rows[r+offset];
            if(!dutyRow) continue;
            const cellText = dutyRow[c];
            if(cellText==null || cellText==='') continue;
            const roleHint = SCHEDULE_ROLE_BY_OFFSET[offset];
            const parsed = parseDutyCellText(cellText, roleHint);
            for(const p of parsed){
              if(!p.name) continue;
              entriesFound++;
              const nameKey = p.name.trim().toLowerCase();
              let empId = nameToEmpId[nameKey];
              if(!empId){
                empId = uid();
                nameToEmpId[nameKey] = empId;
                state.employees.push({id:empId, name:p.name.trim(), role:'', phone:''});
              }
              const key = `${empId}|${dateIso}`;
              if(existingKeys.has(key)) continue; // don't overwrite manually-set shifts
              const noteText = p.role + (p.sub? ` (${p.sub})` : '');
              if(!newShiftsByKey[key]) newShiftsByKey[key] = {employeeId:empId, date:dateIso, notes:new Set()};
              newShiftsByKey[key].notes.add(noteText);
            }
          }
        }
      }
    }

    const newShifts = Object.values(newShiftsByKey).map(x=>({
      id:uid(), employeeId:x.employeeId, date:x.date, note: Array.from(x.notes).join(' / ')
    }));
    state.shifts.push(...newShifts);

    // --- diagnostics: open the browser console (F12) to inspect this ---
    console.log('[Schedule Import] Sheets found:', wb.SheetNames);
    console.log('[Schedule Import] Total sheets read:', sheetsRead, '| total entries parsed:', entriesFound, '| new shifts added:', newShifts.length);
    const debugRange = newShifts
      .filter(s=> s.date>='2026-08-25' && s.date<='2026-09-10')
      .map(s=> ({ date:s.date, employee: (state.employees.find(e=>e.id===s.employeeId)||{}).name, note:s.note }))
      .sort((a,b)=> a.date.localeCompare(b.date));
    console.log('[Schedule Import] Aug25–Sep10 detail (check this against your Excel file):');
    console.table(debugRange);
    await saveList('employees', state.employees);
    await saveList('shifts', state.shifts);

    if(statusEl) statusEl.innerHTML = `<div class="banner" style="background:var(--green-dim); color:#265c39;">✅ นำเข้าสำเร็จ${clearFirst? ' (ล้างข้อมูลเดิมก่อนนำเข้าแล้ว)':''}: อ่าน ${sheetsRead} ชีต พบ ${entriesFound} รายการ เพิ่มวันอยู่เวรใหม่ ${newShifts.length} รายการ${clearFirst? '' : ' (ข้ามรายการที่มีอยู่แล้ว)'}</div>`;
    renderContent();
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.innerHTML = `<div class="banner" style="background:var(--red-dim); color:#8a1f1f;">⚠ นำเข้าไม่สำเร็จ: ${err.message||err}</div>`;
  }
}

                ${isAdmin && appr==='pending'? `<button class="btn btn-amber btn-sm" data-approveappt="${a.id}">✓ อนุมัติ</button>` : ''}
                ${isAdmin && appr==='approved' && done!=='done'? `<button class="btn btn-ghost btn-sm" data-doneappt="${a.id}">ทำเครื่องหมายเสร็จสิ้น</button>` : ''}
                ${isAdmin && appr!=='cancelled' && done!=='done'? `<button class="btn btn-ghost btn-sm" data-cancelappt="${a.id}">ยกเลิก</button>` : ''}
                ${isAdmin && appr!=='pending'? `<button class="btn btn-ghost btn-sm" data-reopenappt="${a.id}">↺ กลับไปรออนุมัติ</button>` : ''}

          }).join('')}
        </tbody>
      </table>` : `<div class="empty">ไม่มีนัดหมายในหมวดนี้</div>`}
    </div>
  `;
}

/* ---------------- Excel import for Appointments (matches "ฟอร์มนัดหมายติดตั้ง.xlsx" header row) ---------------- */
// Expected header row (sheet "นัดหมายติดตั้ง"): Circuit | วันที่ | เวลา | ช่างผู้รับผิดชอบ | เบอร์โทรช่าง | หมายเหตุ
const APPT_HEADER_MAP = {
  'circuit': 'customer',
  'วันที่': 'date',
  'เวลา': 'time',
  'ช่างผู้รับผิดชอบ': 'technicianName',
  'เบอร์โทรช่าง': 'technicianPhone',
  'หมายเหตุ': 'note',
};
function normHeaderTH(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,''); }

function parseApptTimeRange(raw){
  const s = String(raw||'').trim();
  if(!s) return {timeStart:'', timeEnd:'', time:''};
  const parts = s.split('-').map(t=>t.trim()).filter(Boolean);
  const timeStart = parts[0] || '';
  const timeEnd = parts[1] || parts[0] || '';
  const time = timeStart===timeEnd ? timeStart : `${timeStart}-${timeEnd}`;
  return {timeStart, timeEnd, time};
}

async function handleApptExcelImport(file){
  const statusEl = document.getElementById('apptImportStatus');
  if(statusEl) statusEl.innerHTML = `<div class="banner">⏳ กำลังอ่านไฟล์ ${file.name} ...</div>`;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    // prefer a sheet literally named "นัดหมายติดตั้ง" (as in the template), else fall back to the first sheet
    const sheetName = wb.SheetNames.find(n=> normHeaderTH(n)===normHeaderTH('นัดหมายติดตั้ง')) || wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
    if(!rows.length){ throw new Error('ไม่พบข้อมูลในไฟล์'); }

    const headerRow = rows[0];
    const colMap = {}; // colIndex -> fieldKey
    headerRow.forEach((h, idx)=>{
      const key = APPT_HEADER_MAP[normHeaderTH(h)];
      if(key) colMap[idx] = key;
    });
    if(Object.keys(colMap).length===0){
      throw new Error('ไม่พบหัวตารางที่ตรงกับรูปแบบไฟล์ "ฟอร์มนัดหมายติดตั้ง" (Circuit, วันที่, เวลา, ช่างผู้รับผิดชอบ, เบอร์โทรช่าง, หมายเหตุ) กรุณาตรวจสอบแถวแรกของไฟล์');
    }

    let imported = 0, skipped = 0;
    for(let r=1; r<rows.length; r++){
      const row = rows[r];
      if(!row || row.every(c=>c===''||c===undefined||c===null)){ continue; }
      const rec = {date:'', time:'', customer:'', technicianName:'', technicianPhone:'', note:''};
      Object.entries(colMap).forEach(([idx, key])=>{
        const val = row[Number(idx)];
        if(key==='date') rec.date = parseFlexibleDate(val);
        else rec[key] = String(val===undefined||val===null? '' : val).trim();
      });
      if(!rec.customer){ skipped++; continue; }
      if(!rec.date) rec.date = fmtDate(new Date());
      const {timeStart, timeEnd, time} = parseApptTimeRange(rec.time);
      state.appointments.push({
        id: uid(),
        date: rec.date,
        time,
        timeStart, timeEnd,
        customer: rec.customer,
        technicianName: rec.technicianName,
        technicianPhone: rec.technicianPhone,
        note: rec.note,
        approvalStatus: 'pending',
        doneStatus: 'not_done',
        submittedByName: session.user? session.user.name : '',
        submittedByEmail: session.user? session.user.email||'' : '',
      });
      imported++;
    }
    await saveList('appointments', state.appointments);
    if(statusEl) statusEl.innerHTML = `<div class="banner" style="background:var(--green-dim); color:#265c39;">✅ นำเข้าสำเร็จ ${imported} รายการ${skipped? ` (ข้ามแถวว่าง/ไม่มี Circuit ${skipped} แถว)`:''}</div>`;
    renderContent();
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.innerHTML = `<div class="banner" style="background:var(--red-dim); color:#8a1f1f;">⚠ นำเข้าไม่สำเร็จ: ${err.message||err}</div>`;
  }
}

function buildMailtoLink(to, cc, subject, body){
  const params = new URLSearchParams({ subject, body });
  if(cc) params.set('cc', cc);
  return `mailto:${encodeURIComponent(to)}?${params.toString().replace(/\+/g,'%20')}`;
}

let approveState = null; // { apptId, selected:Set<employeeId> }

// kept as the entry point wired from the table's "✓ อนุมัติ" button
function approveAppointment(apptId){
  const appt = state.appointments.find(a=>a.id===apptId);
  if(!appt) return;
  const onDuty = state.shifts.filter(s=> s.date===appt.date)
    .map(s=> state.employees.find(x=>x.id===s.employeeId))
    .filter(Boolean);
  approveState = { apptId, selected: new Set(onDuty.length? [onDuty[0].id] : []) };
  renderApproveDialogSelect();
}

    <div class="dialog-body">
      <div style="font-size:13.5px; margin-bottom:12px; line-height:1.6;">

      </div>
      <div class="field">
        <label>แจ้งชื่อคนอยู่เวรวันนี้เป็น (เลือกได้มากกว่า 1 คน)</label>
        ${onDuty.length? `<div style="border:1px solid var(--line); border-radius:8px; padding:6px 8px; overflow-x:hidden; box-sizing:border-box;">${checkboxes}</div>`
          : `<div class="empty">ไม่มีการจัดเวรสำหรับวันนี้ กรุณาตรวจสอบตารางเวร — จะอนุมัติโดยไม่ระบุชื่อคนอยู่เวรได้</div>`}

function approveEmailFields(appt){
  const FIXED_CC = 'bo-ip-pro@ericsson.com';
  const chosenEmps = Array.from(approveState.selected).map(id=> state.employees.find(e=>e.id===id)).filter(Boolean);
  const onDutyList = chosenEmps.map(e=> `${e.name} โทร ${e.phone||'-'}`);
  const onDutyEmails = chosenEmps.map(e=> (e.email||'').trim()).filter(Boolean);
  const ccList = Array.from(new Set([...onDutyEmails, FIXED_CC]));
  const subject = `นัดหมายติดตั้งได้รับการอนุมัติแล้ว — Circuit ${appt.customer} (${dmy(appt.date)})`;
  const bodyLines = [
    `นัดหมายติดตั้ง Circuit "${appt.customer}" วันที่ ${dmy(appt.date)} ${appt.time||''}`,
    '',
    `ช่างผู้รับผิดชอบ: ${appt.technicianName||empName(appt.employeeId)||'-'}`,
    `เบอร์โทรช่างที่รับผิดชอบ: ${appt.technicianPhone||'-'}`,
    appt.note? `หมายเหตุงาน: ${appt.note}` : null,
    '',
    `ผู้อยู่เวรที่แจ้งในวันที่ ${dmy(appt.date)}:`,
    onDutyList.length? onDutyList.map(l=>`- ${l}`).join('\n') : '(ไม่ได้ระบุชื่อผู้อยู่เวร)',
  ].filter(l=> l!==null).join('\n');
  return { to: appt.submittedByEmail||'', cc: ccList.join(','), subject, body: bodyLines };
}

function bulkApproveEmailFields(appts){
  const FIXED_CC = 'bo-ip-pro@ericsson.com';
  const toList = Array.from(new Set(appts.map(a=> (a.submittedByEmail||'').trim()).filter(Boolean)));
  const ccSet = new Set([FIXED_CC]);
  const blocks = appts.map(appt=>{
    const chosenEmps = (appt.notifiedEmployeeIds||[]).map(id=> state.employees.find(e=>e.id===id)).filter(Boolean);
    chosenEmps.forEach(e=>{ if(e.email) ccSet.add(e.email.trim()); });
    const onDutyList = chosenEmps.map(e=> `${e.name} โทร ${e.phone||'-'}`);
    return [
      `• Circuit ${appt.customer} — วันที่ ${dmy(appt.date)} ${appt.time||''}`,
      `  ช่างผู้รับผิดชอบ: ${appt.technicianName||empName(appt.employeeId)||'-'}`,

      appt.note? `  หมายเหตุงาน: ${appt.note}` : null,
      `  ผู้อยู่เวรที่แจ้ง: ${onDutyList.length? onDutyList.join(', ') : '(ไม่ได้ระบุชื่อผู้อยู่เวร)'}`,
    ].filter(l=> l!==null).join('\n');

  const subject = `นัดหมายติดตั้งได้รับการอนุมัติแล้ว (${appts.length} รายการ)`;
  const body = [

    '',
    blocks.join('\n\n'),

  return { to: toList.join(','), cc: Array.from(ccSet).join(','), subject, body };
}

async function bulkApproveAppts(){
  const ids = Array.from(state.apptSelected).filter(id=>{
    const a = state.appointments.find(x=>x.id===id);
    return a && apptApprovalStatus(a)==='pending';
  });
  if(!ids.length){ alert('กรุณาเลือกนัดหมายที่ยัง "รออนุมัติ" อย่างน้อย 1 รายการ'); return; }
  if(!confirm(`ยืนยันอนุมัตินัดหมายที่เลือก ${ids.length} รายการ และร่างอีเมลแจ้งผลรวมกัน?`)) return;

  const approvedAppts = [];
  for(const id of ids){
    const appt = state.appointments.find(a=>a.id===id);
    if(!appt) continue;
    const onDuty = state.shifts.filter(s=> s.date===appt.date)
      .map(s=> state.employees.find(x=>x.id===s.employeeId))
      .filter(Boolean);
    appt.approvalStatus = 'approved';
    appt.approvedBy = session.user.name;
    appt.approvedAt = fmtDate(new Date());
    appt.notifiedEmployeeIds = onDuty.length? [onDuty[0].id] : [];
    approvedAppts.push(appt);
  }
  await saveList('appointments', state.appointments);
  state.apptSelected.clear();
  renderContent();
  renderBulkApproveEmailDialog(approvedAppts);
}

async function setApptApproval(apptId, approvalStatus, confirmMsg){
  const appt = state.appointments.find(a=>a.id===apptId);
  if(!appt) return;
  if(confirmMsg && !confirm(confirmMsg)) return;
  appt.approvalStatus = approvalStatus;
  await saveList('appointments', state.appointments);
  renderContent();
}

async function revertApptToPending(apptId){
  const appt = state.appointments.find(a=>a.id===apptId);
  if(!appt) return;
  if(!confirm(`ย้อนสถานะนัดหมาย Circuit "${appt.customer}" กลับไปเป็น "รออนุมัติ" ใช่หรือไม่? (ข้อมูลผู้อนุมัติเดิมจะถูกล้าง)`)) return;
  appt.approvalStatus = 'pending';
  delete appt.approvedBy;
  delete appt.approvedAt;
  delete appt.notifiedEmployeeIds;
  appt.doneStatus = 'not_done';
  await saveList('appointments', state.appointments);
  renderContent();
}

async function setApptDone(apptId, doneStatus, confirmMsg){
  const appt = state.appointments.find(a=>a.id===apptId);
  if(!appt) return;
  if(confirmMsg && !confirm(confirmMsg)) return;
  appt.doneStatus = doneStatus;
  await saveList('appointments', state.appointments);
  renderContent();
}

function smcCircuitPool(){
  let list = state.appointments.slice();
  if(smcState.todayOnly){ const today = fmtDate(new Date()); list = list.filter(a=>a.date===today); }
  list.sort((a,b)=> (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  return list;
}
function smcCircuitCountLabel(){
  const count = smcCircuitPool().filter(a=> smcState.selected.has(a.id)).length;
  return count>0 ? `${count} Circuit` : '[ยังไม่ได้เลือก Circuit]';
}
function smcCircuitTableText(){
  const chosen = smcCircuitPool().filter(a=> smcState.selected.has(a.id));
  if(!chosen.length) return '[ยังไม่ได้เลือก Circuit]';
  const rows = chosen.map(a=>{
    const timeRange = (a.timeStart && a.timeEnd) ? `${a.timeStart} - ${a.timeEnd}` : (a.time||'-');
    // this table's status column reflects the notification's phase, not the appointment's
    // live approval/done status — "before" is always "รอดำเนินการ", "after" is always "ดำเนินการเสร็จสิ้น"
    const status = smcState.tab==='after' ? 'ดำเนินการเสร็จสิ้น' : 'รอดำเนินการ';
    return { circuit: a.customer||'-', when: `${timeRange} (${dmy(a.date)})`, status };
  });
  const col1 = Math.max('CIRCUIT'.length, ...rows.map(r=>r.circuit.length)) + 2;
  const col2 = Math.max('เวลานัดหมาย'.length, ...rows.map(r=>r.when.length)) + 2;
  const sepLen = col1 + col2 + Math.max('สถานะ'.length, ...rows.map(r=>r.status.length));
  const header = 'CIRCUIT'.padEnd(col1) + 'เวลานัดหมาย'.padEnd(col2) + 'สถานะ';
  const sep = '-'.repeat(sepLen);
  const lines = rows.map(r=> r.circuit.padEnd(col1) + r.when.padEnd(col2) + r.status);
  return [header, sep, ...lines].join('\n');
}

  const phase = smcState.tab==='before' ? 'ก่อนดำเนินการติดตั้ง' : 'หลังดำเนินการติดตั้ง';

function bindSmcDialogEvents(){

  const todayChk = dlg.querySelector('#smcTodayOnly');
  if(todayChk) todayChk.onchange = ()=>{ captureEditable(); smcState.todayOnly = todayChk.checked; renderSmcDialog(); };

  dlg.querySelectorAll('.smc-circuit-chk').forEach(chk=>{
    chk.onchange = ()=>{
      captureEditable();
      if(chk.checked) smcState.selected.add(chk.value); else smcState.selected.delete(chk.value);
      renderSmcDialog();
    };
  });

  const selAllBtn = dlg.querySelector('#smcSelectAll');
  if(selAllBtn) selAllBtn.onclick = ()=>{ captureEditable(); smcCircuitPool().forEach(a=> smcState.selected.add(a.id)); renderSmcDialog(); };

  };
}

const PW_PAGE_SIZES = [10, 25, 50, 100];
const PW_REF_STATUS = ['Not migrate', 'Completed', 'Cancel'];

// Referance now doubles as the work-status field. Falls back to the legacy
// completed/cancelled booleans for rows toggled before this change.
function pwStatusOf(p){
  const ref = (p.reference||'').trim();
  if(/^completed$/i.test(ref)) return 'completed';
  if(/^cancel(led)?$/i.test(ref)) return 'cancelled';
  if(p.cancelled) return 'cancelled';
  if(p.completed) return 'completed';
  return 'pending';
}

function pwBuildPager(current, total){
  if(total<=1) return [{page:1}];
  const pages = new Set([1, total]);
  for(let i=current-2;i<=current+2;i++){ if(i>=1 && i<=total) pages.add(i); }
  if(current<=5){ for(let i=1;i<=Math.min(5,total);i++) pages.add(i); }
  if(current>=total-4){ for(let i=Math.max(1,total-4);i<=total;i++) pages.add(i); }
  const sorted = [...pages].sort((a,b)=>a-b);
  const result = [];
  let prev = 0;
  sorted.forEach(p=>{
    if(prev && p-prev>1) result.push({ellipsis:true});
    result.push({page:p});
    prev = p;
  });
  return result;
}

// maps a Planwork's Referance field to one of the 3 canonical status labels
function pwRefCategory(p){
  const st = pwStatusOf(p);
  if(st==='completed') return 'Completed';
  if(st==='cancelled') return 'Cancel';
  return 'Not migrate';
}

function pwPlanworkPool(){
  let list = state.planworks.slice();
  if(pwNotifyState.dateFilter){ list = list.filter(p=>p.date===pwNotifyState.dateFilter); }
  const wantDn = (PW_PERIODS.find(p=>p.v===pwNotifyState.period)||PW_PERIODS[0]).dnType;
  list = list.filter(p=> !p.dnType || p.dnType===wantDn); // Planwork with no Day/Night set isn't excluded
  if(pwNotifyState.refFilter && pwNotifyState.refFilter.size < PW_REF_STATUS.length){
    list = list.filter(p=> pwNotifyState.refFilter.has(pwRefCategory(p)));
  }
  return list.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
}

// drop any selected Planwork ids that no longer match the current filters (date / Day-Night)
function pwPruneSelection(){
  const validIds = new Set(pwPlanworkPool().map(p=>p.id));
  pwNotifyState.planworkSelected.forEach(id=>{ if(!validIds.has(id)) pwNotifyState.planworkSelected.delete(id); });

function bindPwNotifyDialogEvents(){
  const dlg = document.getElementById('dlg');
  const captureEditable = ()=>{
    pwNotifyState.to = dlg.querySelector('#pwTo').value;
    pwNotifyState.cc = dlg.querySelector('#pwCc').value;
  };

  dlg.querySelector('#dlgClose').onclick = ()=> dlg.close();

  dlg.querySelectorAll('[data-pwtype]').forEach(el=>{
    el.onclick = ()=>{ captureEditable(); pwNotifyState.type = el.dataset.pwtype; renderPwNotifyDialog(); };
  });

  const periodSel = dlg.querySelector('#pwPeriod');
  if(periodSel) periodSel.onchange = ()=>{
    captureEditable();
    pwNotifyState.period = periodSel.value;
    pwPruneSelection(); // switching Day/Night changes which Planwork are selectable
    renderPwNotifyDialog();
  };

  const dateFilterInput = dlg.querySelector('#pwDateFilter');
  if(dateFilterInput) dateFilterInput.onchange = ()=>{
    captureEditable();
    pwNotifyState.dateFilter = dateFilterInput.value || '';
    pwPruneSelection();
    renderPwNotifyDialog();
  };
  const dateTodayBtn = dlg.querySelector('#pwDateToday');
  if(dateTodayBtn) dateTodayBtn.onclick = ()=>{
    captureEditable();
    pwNotifyState.dateFilter = fmtDate(new Date());
    pwPruneSelection();
    renderPwNotifyDialog();
  };
  const dateClearBtn = dlg.querySelector('#pwDateClear');
  if(dateClearBtn) dateClearBtn.onclick = ()=>{
    captureEditable();
    pwNotifyState.dateFilter = '';
    pwPruneSelection();
    renderPwNotifyDialog();
  };

  dlg.querySelectorAll('.pw-ref-chk').forEach(chk=>{
    chk.onchange = ()=>{
      captureEditable();
      if(chk.checked) pwNotifyState.refFilter.add(chk.value);
      else pwNotifyState.refFilter.delete(chk.value);
      pwPruneSelection();
      renderPwNotifyDialog();
    };
  });

  dlg.querySelectorAll('.pw-plan-chk').forEach(chk=>{
    chk.onchange = ()=>{
      captureEditable();
      if(chk.checked) pwNotifyState.planworkSelected.add(chk.value);
      else pwNotifyState.planworkSelected.delete(chk.value);
      renderPwNotifyDialog();
    };

/* ---------------- Excel import for Planwork ---------------- */
const PW_HEADER_MAP = {
  'dmy':'date', 'date':'date',
  'daynighttime':'dnRaw', 'daynight':'dnRaw', 'time':'dnRaw',
  'planworkno':'planNo', 'planwork_no':'planNo', 'planno':'planNo',
  'detail':'detail',
  'nodempls':'node', 'node':'node', 'mpls':'node',
  'referance':'reference', 'reference':'reference',
  'assingmentby':'assignBy', 'assignmentby':'assignBy', 'assignby':'assignBy',
  'worktype':'workType',
  'vender':'vendor', 'vendor':'vendor',
  'remark':'remark',
  'remarkmail':'remarkMail',
};
function normHeader(s){ return String(s||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }

function excelSerialToISO(serial){
  const utcDays = Math.floor(serial - 25569);
  const utcMs = utcDays*86400*1000;
  const d = new Date(utcMs);
  const p = n=>String(n).padStart(2,'0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())}`;
}
function parseFlexibleDate(v){
  if(v===null || v===undefined || v==='') return '';
  if(typeof v === 'number') return excelSerialToISO(v);
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){
    let [, d, mo, y] = m;
    if(y.length===2) y = (Number(y) < 50 ? '20' : '19') + y;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return '';
}

async function handleExcelImport(file){
  const statusEl = document.getElementById('pwImportStatus');
  if(statusEl) statusEl.innerHTML = `<div class="banner">⏳ กำลังอ่านไฟล์ ${file.name} ...</div>`;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const sheetName = wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
    if(!rows.length){ throw new Error('ไม่พบข้อมูลในไฟล์'); }

    const headerRow = rows[0];
    const colMap = {}; // colIndex -> fieldKey
    headerRow.forEach((h, idx)=>{
      const key = PW_HEADER_MAP[normHeader(h)];
      if(key) colMap[idx] = key;
    });
    if(Object.keys(colMap).length===0){ throw new Error('ไม่พบคอลัมน์ที่ตรงกับหัวตารางที่รองรับ กรุณาตรวจสอบแถวแรกของไฟล์'); }

    let imported = 0, skipped = 0;
    for(let r=1; r<rows.length; r++){
      const row = rows[r];
      if(!row || row.every(c=>c===''||c===undefined||c===null)){ continue; }
      const rec = {date:'', dnType:'Day', dnTime:'', planNo:'', detail:'', node:'', reference:'', assignBy:'', workType:'', vendor:'', remark:'', remarkMail:''};
      Object.entries(colMap).forEach(([idx, key])=>{
        const val = row[Number(idx)];
        if(key==='date') rec.date = parseFlexibleDate(val);
        else if(key==='dnRaw'){
          const raw = String(val||'').trim();
          rec.dnTime = raw;
          rec.dnType = /night/i.test(raw) ? 'Night' : 'Day';
        } else {
          rec[key] = String(val===undefined||val===null? '' : val).trim();
        }
      });
      const hasContent = rec.planNo || rec.detail || rec.node || rec.reference || rec.vendor;
      if(!hasContent){ skipped++; continue; }
      if(!rec.assignBy && rec.date){
        const names = getOnDutyNamesForDate(rec.date, 'MPLS');
        if(names.length) rec.assignBy = names[0];
      }
      state.planworks.push({id:uid(), ...rec});
      imported++;
    }
    await saveList('planworks', state.planworks);
    if(statusEl) statusEl.innerHTML = `<div class="banner">✅ นำเข้าสำเร็จ ${imported} รายการ${skipped? ` (ข้ามแถวว่าง ${skipped} แถว)`:''}</div>`;
    renderContent();
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.innerHTML = `<div class="banner" style="background:var(--red-dim); color:#8a1f1f;">⚠ นำเข้าไม่สำเร็จ: ${err.message||err}</div>`;
  }
}

function exportPlanworksBackup(){

  state.planworks.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(p=>{
    const st = pwStatusOf(p);
    const status = st==='cancelled' ? 'Cancelled' : (st==='completed' ? 'Completed' : 'Pending');
    rows.push([
      dmy(p.date),
      `${p.dnType||''}${p.dnTime? ' '+p.dnTime:''}`.trim(),
      p.planNo||'', p.detail||'', p.node||'', p.reference||'', p.assignBy||'',
      p.workType||'', p.vendor||'', p.remark||'', p.remarkMail||'', status
    ]);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Planwork');
  XLSX.writeFile(wb, `Planwork_Backup_${fmtDate(new Date())}.xlsx`);
}

/* ================= LEAVE ================= */
function viewLeave(){
  const y = state.leaveYear, m = state.leaveMonth;
  const nd = daysInMonth(y,m);
  const monthNames=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const monthStart = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const monthEnd = `${y}-${String(m+1).padStart(2,'0')}-${String(nd).padStart(2,'0')}`;

  const headerDays = [...Array(nd)].map((_,i)=>{
    const d = new Date(y,m,i+1);
    return `<div class="leave-header-day">${i+1}</div>`;
  }).join('');

  const rows = state.employees.map(e=>{
    const leavesForEmp = state.leaves.filter(l=> l.employeeId===e.id && l.start<=monthEnd && l.end>=monthStart);
    const dayDivs = [...Array(nd)].map((_,i)=>{
      const d = new Date(y,m,i+1); const isWeekend = d.getDay()===0||d.getDay()===6;
      return `<div class="leave-day ${isWeekend?'weekend':''}"></div>`;
    }).join('');
    const bars = leavesForEmp.map(l=>{
      const s = l.start < monthStart? monthStart : l.start;
      const en = l.end > monthEnd? monthEnd : l.end;
      const startDay = Number(s.slice(8,10));
      const endDay = Number(en.slice(8,10));
      const leftPct = ((startDay-1)/nd)*100;
      const widthPct = ((endDay-startDay+1)/nd)*100;
      const color = LEAVE_COLORS[l.type] || '#8A97AC';
      return `<div class="leave-bar" title="${l.type} (${l.start} - ${l.end}) ${l.note||''}" style="left:${leftPct}%; width:${widthPct}%; background:${color};">${l.type}</div>`;
    }).join('');
    return `<div class="leave-row">
      <div class="leave-name">${e.name}</div>
      <div class="leave-days" style="--ndays:${nd};">${dayDivs}${bars}</div>
    </div>`;
  }).join('');

  const upcoming = state.leaves.slice().sort((a,b)=>a.start.localeCompare(b.start));

  return `
    <div class="topbar">
      <div><h1>ตารางแสดงคนลา</h1><div class="sub">ภาพรวมวันลาของพนักงานทั้งทีมแบบรายเดือน</div></div>
      <button class="btn btn-amber" id="addLeave">+ บันทึกวันลา</button>
    </div>
    <div class="weeknav" style="margin-bottom:14px;">
      <button class="btn btn-ghost btn-sm" id="prevLeaveMonth">←</button>
      <div class="lbl mono">${monthNames[m]} ${y+543}</div>
      <button class="btn btn-ghost btn-sm" id="nextLeaveMonth">→</button>
    </div>

    <div class="card" style="overflow-x:auto;">
      ${state.employees.length? `
      <div class="leave-grid" style="min-width:${Math.max(600, nd*26)}px;">
        <div></div><div class="leave-header-days" style="--ndays:${nd};">${headerDays}</div>
        ${rows}
      </div>
      <div style="display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--slate-400); margin-top:12px;">
        ${LEAVE_TYPES.map(t=>`<div style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:3px;background:${LEAVE_COLORS[t]};display:inline-block;"></span>${t}</div>`).join('')}
      </div>
      ` : `<div class="empty">ยังไม่มีพนักงานในระบบ</div>`}
    </div>

    <div class="card">
      <h3>รายการวันลาทั้งหมด</h3>
      ${upcoming.length? `
      <table>
        <thead><tr><th>พนักงาน</th><th>ประเภท</th><th>ช่วงวันที่</th><th>หมายเหตุ</th><th></th></tr></thead>
        <tbody>
          ${upcoming.map(l=>`
            <tr>
              <td>${empName(l.employeeId)}</td>
              <td><span class="badge leavetype" style="background:${LEAVE_COLORS[l.type]}22; color:${LEAVE_COLORS[l.type]};">${l.type}</span></td>
              <td class="mono">${l.start} → ${l.end}${l.timeStart? `<br><span style="color:var(--slate-400); font-size:11px;">${l.timeStart}-${l.timeEnd}</span>`:''}</td>
              <td>${l.note||'-'}</td>
              <td style="white-space:nowrap;">
                <button class="btn btn-ghost btn-sm" data-editleave="${l.id}">แก้ไข</button>
                <button class="btn btn-danger btn-sm" data-delleave="${l.id}">ลบ</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty">ยังไม่มีข้อมูลวันลา</div>`}
    </div>
  `;
}

  };

  dlg.innerHTML = `

      <div class="field"><label>ชื่อผู้ใช้ (Username)</label><input id="f_username" value="${existing?existing.username:''}" placeholder="สำหรับล็อกอิน" ${existing?'disabled':''}></div>
      <div class="field"><label>Email</label><input type="email" id="f_email" value="${existing?existing.email||'':''}" placeholder="name@example.com"></div>
      <div class="field"><label>สิทธิ์การใช้งาน</label>
        <select id="f_role">
          <option value="staff" ${existing&&existing.role==='staff'?'selected':''}>ช่างหน้างาน</option>
          <option value="admin" ${existing&&existing.role==='admin'?'selected':''}>ผู้ดูแลระบบ</option>
        </select>
      </div>
      <div class="field"><label>${existing? 'ตั้งรหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)' : 'รหัสผ่าน'}</label><input type="password" id="f_pass" placeholder="อย่างน้อย 6 ตัวอักษร"></div>
    </div>

      <button class="btn btn-ghost" id="dlgCancel">ยกเลิก</button>
      <button class="btn btn-amber" id="saveUser">บันทึก</button>
    </div>
  `;
  dlg.showModal();
  dlg.querySelector('#dlgClose').onclick=()=>dlg.close();
  dlg.querySelector('#dlgCancel').onclick=()=>dlg.close();
  dlg.querySelector('#saveUser').onclick = async ()=>{
    const name = dlg.querySelector('#f_name').value.trim();
    const username = dlg.querySelector('#f_username').value.trim().toLowerCase();
    const email = dlg.querySelector('#f_email').value.trim();
    const role = dlg.querySelector('#f_role').value;
    const pass = dlg.querySelector('#f_pass').value;
    if(!name || !username){ alert('กรุณากรอกชื่อและชื่อผู้ใช้'); return; }
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ alert('กรุณากรอก Email ให้ถูกต้อง'); return; }
    if(!existing && !pass){ alert('กรุณาตั้งรหัสผ่าน'); return; }
    if(pass && pass.length<6){ alert('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); return; }
    if(!existing && state.users.some(u=>u.username.toLowerCase()===username)){ alert('มีชื่อผู้ใช้นี้อยู่แล้ว'); return; }

    if(existing){
      existing.name = name; existing.role = role; existing.email = email;
      if(pass) existing.passwordHash = await sha256(pass);
      if(session.user.id===existing.id) session.user = existing;
    } else {
      const passwordHash = await sha256(pass);
      state.users.push({id:uid(), username, name, email, role, passwordHash, approved:true});
    }
    await saveList('users', state.users);
    dlg.close(); renderNav(); renderContent();
  };
}
