    </div>
  `;
  dlg.showModal();
  dlg.querySelector('#dlgClose').onclick=()=>dlg.close();
  dlg.querySelector('#dlgCancel').onclick=()=>dlg.close();
  dlg.querySelector('#saveEmp').onclick = async ()=>{
    const name = dlg.querySelector('#f_name').value.trim();
    if(!name){ alert('กรุณากรอกชื่อ'); return; }
    const data = { name, phone: dlg.querySelector('#f_phone').value.trim(), email: dlg.querySelector('#f_email').value.trim() };
    if(existing){ Object.assign(existing, data); }
    else { state.employees.push({id:uid(), ...data}); }
    await saveList('employees', state.employees);
    dlg.close(); renderContent();
  };
}

/* ---------------- event binding ---------------- */
function bindContentEvents(){
  const c = document.getElementById('content');

  // report
  const expExcel = c.querySelector('#exportExcelReport'); if(expExcel) expExcel.onclick = ()=> exportReportToExcel();
  const expPptx = c.querySelector('#exportPptxReport'); if(expPptx) expPptx.onclick = ()=> exportReportToPptx();
  c.querySelectorAll('[data-rp]').forEach(el=> el.onclick=()=>{ state.reportPeriod = el.dataset.rp; renderContent(); });
  const repPrev = c.querySelector('#repPrev'); if(repPrev) repPrev.onclick=()=>{ shiftReportRef(-1); renderContent(); };
  const repNext = c.querySelector('#repNext'); if(repNext) repNext.onclick=()=>{ shiftReportRef(1); renderContent(); };
  const repNow = c.querySelector('#repNow'); if(repNow) repNow.onclick=()=>{ state.reportRef = fmtDate(new Date()); renderContent(); };

  // calendar
  c.querySelectorAll('.cal-cell[data-day]').forEach(el=>{
    el.addEventListener('click', ()=> openDayDialog(el.dataset.day));
  });
  const pcm = c.querySelector('#prevCalMonth'); if(pcm) pcm.onclick=()=>{ let m=state.calMonth-1,y=state.calYear; if(m<0){m=11;y--;} state.calMonth=m; state.calYear=y; renderContent(); };
  const ncm = c.querySelector('#nextCalMonth'); if(ncm) ncm.onclick=()=>{ let m=state.calMonth+1,y=state.calYear; if(m>11){m=0;y++;} state.calMonth=m; state.calYear=y; renderContent(); };
  const tcm = c.querySelector('#thisCalMonth'); if(tcm) tcm.onclick=()=>{ state.calMonth=new Date().getMonth(); state.calYear=new Date().getFullYear(); renderContent(); };

  // schedule
  c.querySelectorAll('.cell-shift').forEach(el=>{
    el.addEventListener('click', ()=> toggleShift(el.dataset.emp, el.dataset.date));
  });
  const pw = c.querySelector('#prevWeek'); if(pw) pw.onclick=()=>{ const d=new Date(state.weekStart); d.setDate(d.getDate()-7); state.weekStart=d; renderContent(); };
  const nw = c.querySelector('#nextWeek'); if(nw) nw.onclick=()=>{ const d=new Date(state.weekStart); d.setDate(d.getDate()+7); state.weekStart=d; renderContent(); };
  const tw = c.querySelector('#thisWeek'); if(tw) tw.onclick=()=>{ state.weekStart=startOfWeek(new Date()); renderContent(); };
  const schedImportBtn = c.querySelector('#importScheduleExcel');
  const schedFileInput = c.querySelector('#scheduleFileInput');
  if(schedImportBtn && schedFileInput){
    schedImportBtn.onclick = ()=> schedFileInput.click();
    schedFileInput.onchange = (e)=>{
      const file = e.target.files[0];
      const clearFirst = c.querySelector('#clearBeforeImport')?.checked || false;
      if(file) handleScheduleExcelImport(file, clearFirst);
      schedFileInput.value = '';
    };
  }

  // appointments
  const aAdd = c.querySelector('#addAppt'); if(aAdd) aAdd.onclick=()=>openApptDialog(null);
  const smcBtn = c.querySelector('#openSmcMonitor'); if(smcBtn) smcBtn.onclick=()=>openSmcMonitorDialog();
  const exportApptBtn = c.querySelector('#exportApptExcel'); if(exportApptBtn) exportApptBtn.onclick=()=>exportApptToExcel();
  const importApptBtn = c.querySelector('#importApptExcel');
  const apptFileInput = c.querySelector('#apptFileInput');
  if(importApptBtn && apptFileInput){
    importApptBtn.onclick = ()=> apptFileInput.click();
    apptFileInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(file) handleApptExcelImport(file);
      apptFileInput.value = '';
    };
  }
  c.querySelectorAll('[data-editappt]').forEach(el=> el.onclick=()=> openApptDialog(state.appointments.find(a=>a.id===el.dataset.editappt)));
  c.querySelectorAll('[data-approveappt]').forEach(el=> el.onclick=()=> approveAppointment(el.dataset.approveappt));
  c.querySelectorAll('[data-doneappt]').forEach(el=> el.onclick=()=> setApptDone(el.dataset.doneappt, 'done', 'ทำเครื่องหมายนัดหมายนี้เป็น "เสร็จสิ้น" ใช่หรือไม่?'));
  c.querySelectorAll('[data-cancelappt]').forEach(el=> el.onclick=()=> setApptApproval(el.dataset.cancelappt, 'cancelled', 'ยกเลิกนัดหมายนี้ใช่หรือไม่?'));
  c.querySelectorAll('[data-reopenappt]').forEach(el=> el.onclick=()=> revertApptToPending(el.dataset.reopenappt));
  c.querySelectorAll('[data-delappt]').forEach(el=> el.onclick= async ()=>{
    if(!confirm('ยืนยันการลบนัดหมายนี้?')) return;
    state.appointments = state.appointments.filter(a=>a.id!==el.dataset.delappt);
    await saveList('appointments', state.appointments); renderContent();
  });
  c.querySelectorAll('.pill-tab[data-f]').forEach(el=> el.onclick=()=>{ state.apptFilter = el.dataset.f; renderContent(); });

  // appointments: bulk-select + approve & draft combined email
  c.querySelectorAll('.appt-row-chk').forEach(el=> el.onchange = ()=>{
    if(el.checked) state.apptSelected.add(el.dataset.rowchk);
    else state.apptSelected.delete(el.dataset.rowchk);
    renderContent();
  });
  const apptSelectAllChk = c.querySelector('#apptSelectAllChk');
  if(apptSelectAllChk) apptSelectAllChk.onchange = ()=>{
    c.querySelectorAll('.appt-row-chk').forEach(el=>{
      if(apptSelectAllChk.checked) state.apptSelected.add(el.dataset.rowchk);
      else state.apptSelected.delete(el.dataset.rowchk);
    });
    renderContent();
  };
  const apptBulkApprove = c.querySelector('#apptBulkApprove'); if(apptBulkApprove) apptBulkApprove.onclick = ()=> bulkApproveAppts();
  const apptBulkClearSel = c.querySelector('#apptBulkClearSel'); if(apptBulkClearSel) apptBulkClearSel.onclick = ()=>{ state.apptSelected.clear(); renderContent(); };

  // planwork
  const pwAdd = c.querySelector('#addPlanwork'); if(pwAdd) pwAdd.onclick=()=>openPlanworkDialog(null);
  const pwNotifyBtn = c.querySelector('#openPwNotify'); if(pwNotifyBtn) pwNotifyBtn.onclick=()=>openPwNotifyDialog();
  const fixLegacyBtn = c.querySelector('#fixLegacyAssign'); if(fixLegacyBtn) fixLegacyBtn.onclick=()=>fixLegacyAssignBy();
  const pwImportBtn = c.querySelector('#importExcel');
  const pwFileInput = c.querySelector('#pwFileInput');
  if(pwImportBtn && pwFileInput){
    pwImportBtn.onclick = ()=> pwFileInput.click();
    pwFileInput.onchange = (e)=>{
      const file = e.target.files[0];
      if(file) handleExcelImport(file);
      pwFileInput.value = '';
    };
  }
  c.querySelectorAll('[data-editpw]').forEach(el=> el.onclick=()=> openPlanworkDialog(state.planworks.find(p=>p.id===el.dataset.editpw)));
  c.querySelectorAll('[data-delpw]').forEach(el=> el.onclick= async ()=>{
    if(!confirm('ยืนยันการลบ Planwork นี้?')) return;
    state.planworks = state.planworks.filter(p=>p.id!==el.dataset.delpw);
    await saveList('planworks', state.planworks); renderContent();
  });
  c.querySelectorAll('[data-refstatus]').forEach(el=> el.onchange = async ()=>{
    const p = state.planworks.find(x=>x.id===el.dataset.refstatus);
    if(!p) return;
    p.reference = el.value;
    await saveList('planworks', state.planworks); renderContent();
  });
  const pwSearch = c.querySelector('#pwSearch');
  if(pwSearch){
    pwSearch.oninput = ()=>{ state.planworkSearch = pwSearch.value; };
    pwSearch.onkeydown = (e)=>{ if(e.key==='Enter'){ state.planworkPage=1; renderContent(); } };
    pwSearch.onblur = ()=>{ state.planworkPage=1; renderContent(); };
  }
  const pwDateFrom = c.querySelector('#pwDateFrom');
  if(pwDateFrom) pwDateFrom.onchange = ()=>{ state.planworkDateFrom = pwDateFrom.value; state.planworkPage=1; renderContent(); };
  const pwDateTo = c.querySelector('#pwDateTo');
  if(pwDateTo) pwDateTo.onchange = ()=>{ state.planworkDateTo = pwDateTo.value; state.planworkPage=1; renderContent(); };
  const pwDateClearFilter = c.querySelector('#pwDateClearFilter');
  if(pwDateClearFilter) pwDateClearFilter.onclick = ()=>{ state.planworkDateFrom=''; state.planworkDateTo=''; state.planworkPage=1; renderContent(); };

  // planwork: row selection checkboxes
  c.querySelectorAll('[data-rowchk]').forEach(el=> el.onchange = ()=>{
    if(el.checked) state.planworkSelected.add(el.dataset.rowchk);
    else state.planworkSelected.delete(el.dataset.rowchk);
    renderContent();
  });
  const pwSelectAllPage = c.querySelector('#pwSelectAllPage');
  if(pwSelectAllPage) pwSelectAllPage.onchange = ()=>{
    c.querySelectorAll('[data-rowchk]').forEach(el=>{
      if(pwSelectAllPage.checked) state.planworkSelected.add(el.dataset.rowchk);
      else state.planworkSelected.delete(el.dataset.rowchk);
    });
    renderContent();
  };
  const pwBulkSetNotMigrate = c.querySelector('#pwBulkSetNotMigrate');
  if(pwBulkSetNotMigrate) pwBulkSetNotMigrate.onclick = async ()=>{
    state.planworks.forEach(p=>{ if(state.planworkSelected.has(p.id)) p.reference = 'Not migrate'; });
    await saveList('planworks', state.planworks); renderContent();
  };
  const pwBulkSetCompleted = c.querySelector('#pwBulkSetCompleted');
  if(pwBulkSetCompleted) pwBulkSetCompleted.onclick = async ()=>{
    state.planworks.forEach(p=>{ if(state.planworkSelected.has(p.id)) p.reference = 'Completed'; });
    await saveList('planworks', state.planworks); renderContent();
  };
  const pwBulkSetCancel = c.querySelector('#pwBulkSetCancel');
  if(pwBulkSetCancel) pwBulkSetCancel.onclick = async ()=>{
    if(!confirm(`ยืนยันการตั้งค่า Referance เป็น "Cancel" สำหรับ Planwork ที่เลือก ${state.planworkSelected.size} รายการ?`)) return;
    state.planworks.forEach(p=>{ if(state.planworkSelected.has(p.id)) p.reference = 'Cancel'; });
    await saveList('planworks', state.planworks); renderContent();
  };
  const pwBulkEdit = c.querySelector('#pwBulkEdit');
  if(pwBulkEdit) pwBulkEdit.onclick = ()=> openPwBulkEditDialog([...state.planworkSelected]);
  const pwBulkDelete = c.querySelector('#pwBulkDelete');
  if(pwBulkDelete) pwBulkDelete.onclick = async ()=>{
    if(!confirm(`ยืนยันการลบ Planwork ที่เลือก ${state.planworkSelected.size} รายการ?`)) return;
    state.planworks = state.planworks.filter(p=>!state.planworkSelected.has(p.id));
    state.planworkSelected.clear();
    await saveList('planworks', state.planworks); renderContent();
  };
  const pwBulkClearSel = c.querySelector('#pwBulkClearSel');
  if(pwBulkClearSel) pwBulkClearSel.onclick = ()=>{ state.planworkSelected.clear(); renderContent(); };

  const exportPwExcelBtn = c.querySelector('#exportPwExcel');
  if(exportPwExcelBtn) exportPwExcelBtn.onclick = ()=> exportPlanworksBackup();
  const clearAllPwBtn = c.querySelector('#clearAllPw');
  if(clearAllPwBtn) clearAllPwBtn.onclick = async ()=>{
    if(!state.planworks.length){ alert('ไม่มีข้อมูล Planwork ให้ล้าง'); return; }
    if(!confirm(`⚠ ยืนยันการล้างข้อมูล Planwork ทั้งหมด ${state.planworks.length} รายการ?\nแนะนำให้กด "Export Excel (Backup)" เพื่อสำรองข้อมูลไว้ก่อน\n\nการลบนี้ไม่สามารถกู้คืนได้`)) return;
    if(!confirm('ยืนยันอีกครั้ง: ต้องการลบข้อมูล Planwork ทั้งหมดจริงหรือไม่?')) return;
    state.planworks = [];
    state.planworkSelected.clear();
    await saveList('planworks', state.planworks); renderContent();
  };

  // planwork: pagination
  const pwPageSize = c.querySelector('#pwPageSize');
  if(pwPageSize) pwPageSize.onchange = ()=>{ state.planworkPageSize = Number(pwPageSize.value); state.planworkPage=1; renderContent(); };
  const pwPagePrev = c.querySelector('#pwPagePrev');
  if(pwPagePrev) pwPagePrev.onclick = ()=>{ state.planworkPage = Math.max(1, state.planworkPage-1); renderContent(); };
  const pwPageNext = c.querySelector('#pwPageNext');
  if(pwPageNext) pwPageNext.onclick = ()=>{ state.planworkPage = state.planworkPage+1; renderContent(); };
  c.querySelectorAll('[data-page]').forEach(el=> el.onclick = ()=>{ state.planworkPage = Number(el.dataset.page); renderContent(); });

  // OT
  const otAdd = c.querySelector('#addOT'); if(otAdd) otAdd.onclick=()=>openOTDialog();
  const pom = c.querySelector('#prevOTMonth'); if(pom) pom.onclick=()=>{ let m=state.otMonth-1,y=state.otYear; if(m<0){m=11;y--;} state.otMonth=m; state.otYear=y; renderContent(); };
  const nom = c.querySelector('#nextOTMonth'); if(nom) nom.onclick=()=>{ let m=state.otMonth+1,y=state.otYear; if(m>11){m=0;y++;} state.otMonth=m; state.otYear=y; renderContent(); };
  c.querySelectorAll('[data-delot]').forEach(el=> el.onclick= async ()=>{
    if(!confirm('ยืนยันการลบรายการนี้?')) return;
    state.otEntries = state.otEntries.filter(o=>o.id!==el.dataset.delot);
    await saveList('ot-entries', state.otEntries); renderContent();
  });

  // leave
  const lAdd = c.querySelector('#addLeave'); if(lAdd) lAdd.onclick=()=>openLeaveDialog(null);
  const plm = c.querySelector('#prevLeaveMonth'); if(plm) plm.onclick=()=>{ let m=state.leaveMonth-1,y=state.leaveYear; if(m<0){m=11;y--;} state.leaveMonth=m; state.leaveYear=y; renderContent(); };
  const nlm = c.querySelector('#nextLeaveMonth'); if(nlm) nlm.onclick=()=>{ let m=state.leaveMonth+1,y=state.leaveYear; if(m>11){m=0;y++;} state.leaveMonth=m; state.leaveYear=y; renderContent(); };
  c.querySelectorAll('[data-editleave]').forEach(el=> el.onclick=()=> openLeaveDialog(state.leaves.find(l=>l.id===el.dataset.editleave)));
  c.querySelectorAll('[data-delleave]').forEach(el=> el.onclick= async ()=>{
    if(!confirm('ยืนยันการลบวันลานี้?')) return;
    state.leaves = state.leaves.filter(l=>l.id!==el.dataset.delleave);
    await saveList('leaves', state.leaves); renderContent();
  });

  // users
  const uAdd = c.querySelector('#addUser'); if(uAdd) uAdd.onclick=()=>openUserDialog(null);
  c.querySelectorAll('[data-edituser]').forEach(el=> el.onclick=()=> openUserDialog(state.users.find(x=>x.id===el.dataset.edituser)));
  c.querySelectorAll('[data-approveuser]').forEach(el=> el.onclick= async ()=>{
    const u = state.users.find(x=>x.id===el.dataset.approveuser);
    if(u){ u.approved = true; await saveList('users', state.users); renderContent(); }
  });
  c.querySelectorAll('[data-deluser]').forEach(el=> el.onclick= async ()=>{
    if(!confirm('ลบผู้ใช้งานนี้?')) return;
    state.users = state.users.filter(x=>x.id!==el.dataset.deluser);
    await saveList('users', state.users); renderContent();
  });

  // team
  const eAdd = c.querySelector('#addEmp'); if(eAdd) eAdd.onclick=()=>openEmpDialog(null);
  c.querySelectorAll('[data-editemp]').forEach(el=> el.onclick=()=> openEmpDialog(state.employees.find(x=>x.id===el.dataset.editemp)));
  c.querySelectorAll('[data-delemp]').forEach(el=> el.onclick= async ()=>{
    if(!confirm('ลบพนักงานคนนี้? ข้อมูลเวร/นัดหมาย/OT/ลาที่ผูกกับคนนี้จะยังอยู่แต่จะแสดงชื่อไม่ได้')) return;
    state.employees = state.employees.filter(x=>x.id!==el.dataset.delemp);
    await saveList('employees', state.employees); renderContent();
  });
}

init();
</script>
